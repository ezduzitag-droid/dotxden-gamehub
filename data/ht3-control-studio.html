<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#00000000">
  <meta name="description" content="Transparent, compact floating menu for Hard Time III. No mock gameplay, no background artwork, no memory modification. Original GameGuardian menu structure v2.1.1.">
  <title>Hard Time III · Floating Menu Concept</title>
  <style>
    :root {
      color-scheme:dark;
      --black:#050403;
      --panel:#140e09;
      --panel-2:#20150d;
      --panel-3:#2c1c10;
      --border:rgba(239,189,100,.18);
      --border-strong:rgba(255,203,118,.37);
      --text:#fff4db;
      --sub:#c9b18b;
      --muted:#927b5d;
      --gold:#ffd36b;
      --amber:#e6a72d;
      --brown:#815019;
      --glow:rgba(230,167,45,.23);
      --gradient:linear-gradient(125deg,#ffdc82 0%,#e8a731 45%,#965518 100%);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    }
    *,*::before,*::after {box-sizing:border-box}
    /* TRUE ALPHA: everything outside the floating icon and menu is transparent.
       The Android host must also configure its WebView/window as transparent. */
    html,body {margin:0;width:100%;height:100%;min-height:100%;background:transparent!important;color:var(--text);overflow:hidden}
    body {-webkit-tap-highlight-color:transparent}
    .overlay-root {
      position:fixed;inset:0;width:100%;height:100%;height:100dvh;
      isolation:isolate;overflow:hidden;border:0;box-shadow:none;background:transparent!important;
      pointer-events:none;
    }
    button,input {font:inherit}
    button {cursor:pointer}
    button:focus-visible,input:focus-visible {outline:2px solid var(--gold);outline-offset:3px}
    button:disabled {opacity:.55;cursor:not-allowed}
    [hidden] {display:none!important}
    .svg {width:18px;height:18px;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.8;flex:none}
    .svg.sm {width:15px;height:15px}
    .svg.lg {width:21px;height:21px}
    /* Single compact overlay. It is anchored to and moved alongside the floating icon. */
    .float-icon {
      position:absolute;z-index:11;width:55px;height:55px;left:18px;top:45%;
      border:1px solid rgba(255,215,135,.55);border-radius:19px;
      display:grid;place-items:center;color:#ffe5a8;cursor:grab;
      background:linear-gradient(135deg,#392712 0%,#160f08 52%,#090706 100%);
      box-shadow:inset 0 1px 1px rgba(255,235,172,.26),0 0 0 4px rgba(201,143,45,.10),0 9px 29px rgba(0,0,0,.55),0 0 23px rgba(232,168,47,.17);
      touch-action:none;user-select:none;-webkit-user-select:none;
      transition:box-shadow .2s,background .2s;
    }
    .float-icon:hover,.float-icon[aria-expanded="true"] {
      box-shadow:inset 0 1px 1px rgba(255,235,172,.3),0 0 0 5px rgba(201,143,45,.15),0 0 37px rgba(229,160,42,.33),0 11px 34px rgba(0,0,0,.55);
    }
    .float-icon:active {cursor:grabbing}
    .float-icon {pointer-events:auto}
    .menu {pointer-events:auto}
    .float-icon::before {content:"";position:absolute;inset:4px;border:1px solid rgba(246,192,97,.22);border-radius:14px;pointer-events:none}
    .float-icon::after {content:"";position:absolute;left:14px;right:14px;bottom:9px;height:2px;border-radius:2px;background:var(--gradient);opacity:.8}
    .float-symbol {font-size:19px;font-weight:900;font-style:italic;letter-spacing:-1.5px;color:#f8c867;text-shadow:0 0 15px rgba(250,193,82,.32)}
    .menu {
      position:absolute;z-index:10;left:84px;top:12px;
      width:340px;max-width:calc(100% - 16px);max-height:calc(100% - 16px);
      overflow:hidden;display:none;flex-direction:column;
      border-radius:22px;
      background:linear-gradient(155deg,rgba(44,28,14,.96) -20%,rgba(17,12,8,.97) 33%,rgba(12,9,7,.975) 100%);
      border:1px solid var(--border-strong);
      box-shadow:0 24px 80px rgba(0,0,0,.79),0 0 0 1px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,226,164,.13),0 0 42px rgba(197,127,29,.08);
      -webkit-backdrop-filter:blur(25px) saturate(145%);
      backdrop-filter:blur(25px) saturate(145%);
      animation:menu-in .15s ease-out;
    }
    .menu.open {display:flex}
    @keyframes menu-in {from {opacity:.5;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
    .menu::before {content:"";position:absolute;left:0;top:0;right:0;height:2px;background:var(--gradient);z-index:4;pointer-events:none}
    .menu-head {
      display:flex;align-items:center;gap:10px;min-height:61px;padding:11px 12px 10px 14px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(125deg,rgba(208,138,43,.19),transparent 74%);flex:none;
    }
    .mark {
      width:37px;height:37px;flex:none;border-radius:13px;display:grid;place-items:center;
      color:#2b1a08;font-size:12px;font-weight:900;letter-spacing:-.3px;
      background:var(--gradient);box-shadow:inset 0 1px rgba(255,242,195,.75),0 4px 14px rgba(236,170,54,.13);
    }
    .head-text {min-width:0;flex:1}
    .menu-kicker {font-size:9px;font-weight:800;letter-spacing:1.45px;color:var(--amber);text-transform:uppercase}
    .menu-title {font-size:14px;font-weight:830;letter-spacing:-.35px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5}
    .head-button {
      background:rgba(255,228,166,.055);color:var(--sub);
      width:30px;height:30px;border:1px solid var(--border);border-radius:10px;display:grid;place-items:center;
    }
    .head-button:hover {background:rgba(234,170,67,.13);color:var(--gold)}
    .menu-content {
      min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;
      scrollbar-color:rgba(198,141,51,.47) transparent;
      padding:7px 8px;
    }
    .menu-content::-webkit-scrollbar {width:4px}
    .menu-content::-webkit-scrollbar-thumb {background:rgba(219,165,73,.37);border-radius:10px}
    .menu-intro {
      font-size:10px;color:var(--muted);letter-spacing:.65px;
      padding:6px 10px 9px;font-weight:650;line-height:1.5;
    }
    .item {
      display:flex;align-items:center;gap:10px;width:100%;min-height:42px;
      padding:8px 9px;text-align:left;color:var(--text);
      border:1px solid transparent;border-radius:12px;background:transparent;
      transition:background .15s,border-color .15s;
    }
    .item:hover,.item:focus-visible {background:rgba(201,139,43,.095);border-color:rgba(227,165,70,.15)}
    .item + .item {margin-top:2px}
    .item-ico {
      width:30px;height:30px;display:grid;place-items:center;flex:none;border-radius:10px;
      background:linear-gradient(140deg,rgba(219,146,47,.16),rgba(111,63,21,.13));
      color:#efbf69;border:1px solid rgba(220,162,73,.10);
    }
    .item-ico.muted {color:#ac8150;background:rgba(126,86,42,.11)}
    .item-label {min-width:0;flex:1;display:block;font-size:11.7px;font-weight:770;letter-spacing:.0px;line-height:1.3}
    .item-label small {display:block;margin-top:3px;font-size:10px;font-weight:490;color:var(--muted)}
    .item-right {display:flex;align-items:center;justify-content:flex-end;gap:5px;color:var(--muted);font-size:11px;font-weight:750;white-space:nowrap;font-variant-numeric:tabular-nums}
    .item-value {color:#ffd478;max-width:110px;overflow:hidden;text-overflow:ellipsis}
    .lamp {width:7px;height:7px;border-radius:50%;background:#dca23e;box-shadow:0 0 0 3px rgba(232,168,67,.12);flex:none}
    .item.exit {color:var(--sub)}
    .item.exit .item-ico {color:#b68d54;background:rgba(144,91,43,.08)}
    .menu-foot {
      min-height:35px;flex:none;padding:8px 14px;
      border-top:1px solid var(--border);background:rgba(0,0,0,.17);
      display:flex;align-items:center;justify-content:space-between;gap:6px;
      color:var(--muted);font-size:9px;font-weight:800;letter-spacing:.55px;
    }
    .foot-status {display:flex;align-items:center;gap:7px}
    .foot-status .lamp {width:6px;height:6px}
    .version {color:#a27d43}
    .group-cap {
      margin:4px 6px 8px;padding:9px 10px;border-radius:11px;border:1px solid rgba(215,159,71,.13);
      background:rgba(193,121,33,.075);
      color:var(--sub);font-size:10.5px;line-height:1.5;
    }
    .group-cap strong {color:var(--gold)}
    .separator {height:1px;background:var(--border);margin:7px 9px}
    .section-info {
      padding:8px 12px;margin:3px 6px 7px;border-left:2px solid rgba(222,159,51,.4);
      font-size:10.5px;color:var(--sub);line-height:1.55;background:rgba(255,188,90,.035);
    }
    .mini-badge {font-size:9px;font-weight:850;color:var(--amber);background:rgba(220,151,40,.10);padding:5px 7px;border-radius:7px;border:1px solid rgba(218,160,61,.13)}
    .status-item {
      display:flex;justify-content:space-between;gap:8px;align-items:center;
      padding:10px 12px;margin:0 4px;border-bottom:1px solid var(--border);
      color:var(--sub);font-size:11px;
    }
    .status-item:last-of-type {border-bottom:0}
    .status-item b {font-size:10px;color:var(--amber)}
    .mini-button {
      display:inline-flex;gap:7px;align-items:center;justify-content:center;
      border-radius:11px;padding:10px 12px;border:1px solid var(--border);
      font-size:11px;font-weight:850;background:rgba(201,141,48,.1);color:var(--gold);
    }
    .mini-button:hover {background:rgba(224,162,61,.19)}
    .mini-button.primary {background:var(--gradient);color:#271807;border-color:rgba(255,222,141,.44)}
    .mini-button.wide {width:100%;margin-top:11px}
    .edit-wrap {padding:9px 10px 12px}
    .edit-name {color:var(--sub);font-size:10px;letter-spacing:1px;font-weight:800;text-transform:uppercase}
    .edit-large {color:var(--gold);font-weight:880;font-size:28px;letter-spacing:-1px;margin:8px 0 12px;font-variant-numeric:tabular-nums;word-break:break-word}
    .edit-label {display:block;font-size:11px;font-weight:800;color:var(--text);margin-bottom:7px}
    .edit-input {
      display:block;width:100%;min-height:42px;background:#080604;color:var(--text);
      border:1px solid rgba(232,177,84,.38);border-radius:11px;
      padding:9px 12px;font-size:18px;font-weight:770;font-variant-numeric:tabular-nums;
      outline:none;
    }
    .edit-input:focus {border-color:var(--gold);box-shadow:0 0 0 3px rgba(216,151,37,.10)}
    .edit-help {font-size:10px;color:var(--muted);line-height:1.55;margin:8px 0 0}
    .error {font-size:10px;color:#ffc28b;min-height:0;margin:9px 0 0}
    .edit-buttons {display:flex;gap:8px;margin-top:13px}
    .edit-buttons button {flex:1}
    .mock-visual {
      margin:2px 6px 9px;padding:12px;
      border:1px solid rgba(233,179,81,.15);border-radius:13px;
      background:linear-gradient(110deg,rgba(221,153,44,.10),rgba(90,56,21,.07));
    }
    .mock-visual .label {font-size:9px;color:var(--muted);letter-spacing:1px;font-weight:800}
    .meter {height:5px;border-radius:10px;overflow:hidden;background:rgba(152,99,35,.22);margin:8px 0 6px}
    .meter span {display:block;height:100%;width:82%;border-radius:10px;background:var(--gradient)}
    .mock-visual .value {font-size:12px;font-weight:830;color:var(--gold);font-variant-numeric:tabular-nums}
    .toast {
      position:absolute;z-index:20;bottom:16px;left:50%;transform:translate(-50%,12px);max-width:calc(100% - 32px);
      padding:9px 13px;border-radius:11px;border:1px solid var(--border-strong);
      background:rgba(32,21,11,.96);color:#ffe2a5;pointer-events:none;
      opacity:0;transition:opacity .18s,transform .18s;
      font-size:10.5px;font-weight:700;text-align:center;box-shadow:0 10px 28px #000a;
    }
    .toast.show {opacity:1;transform:translate(-50%,0)}
    .rotate {display:none;pointer-events:none}
    @media(max-height:470px) {
      .menu {width:324px;border-radius:18px}
      .menu-head {min-height:48px;padding:7px 10px}
      .mark {width:32px;height:32px;border-radius:10px}
      .menu-title {font-size:12px}
      .menu-kicker {font-size:8px}
      .item {min-height:38px;padding:5px 8px}
      .item-ico {width:27px;height:27px}
      .menu-content {padding:5px 7px}
      .menu-intro {padding:4px 9px 6px}
      .menu-foot {min-height:29px;padding:6px 12px}
    }
    @media(max-width:460px) {
      .float-icon {width:49px;height:49px}
      .menu {width:min(324px,calc(100% - 16px))}
    }
    @media(prefers-reduced-motion:reduce) {
      *,*::before,*::after {animation:none!important;transition:none!important;scroll-behavior:auto!important}
    }
  </style>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="position:absolute;overflow:hidden;width:0;height:0">

  <!-- HTML overlay root: NO game scene, mock HUD, artwork, joystick or background.
       In Android: transparent WebView background plus native touch pass-through are
       required; CSS pointer-events:none cannot by itself pass Android touch events
       to Unity beneath a full-screen WebView. -->
  <main class="overlay-root" id="device" aria-label="Transparent Hard Time III floating menu overlay">
    <button id="float" class="float-icon" type="button" aria-controls="menu" aria-expanded="false" aria-label="Open or close Hard Time III floating menu" title="Tap to open · drag to reposition">
      <span class="float-symbol">III</span>
    </button>
    <section id="menu" class="menu" aria-label="Hard Time III developer menu" aria-hidden="true">
      <header class="menu-head">
        <button id="back" class="head-button" type="button" aria-label="Go back" hidden><svg class="svg sm"><use href="#i-back"/></svg></button>
        <span id="menu-mark" class="mark">HT</span>
        <div class="head-text">
          <div class="menu-kicker">Hard Time III · v2.1.1</div>
          <div class="menu-title" id="menu-title">Developer controls</div>
        </div>
        <button id="close" class="head-button" type="button" aria-label="Close floating menu"><svg class="svg sm"><use href="#i-close"/></svg></button>
      </header>
      <div id="menu-content" class="menu-content"></div>
      <footer class="menu-foot">
        <span class="foot-status"><span class="lamp"></span> UI PREVIEW · OFFLINE</span>
        <span class="version">GG-STYLE · V1.1</span>
      </footer>
    </section>
    <div id="toast" class="toast" aria-live="polite" role="status"></div>
  </main>

  <script>
  "use strict";
  /*
    Hard Time III Floating Developer Menu — cosmetic concept.
    Original source: data/node_6f2e9a.lua (GG Lua v2.1.1).
    Single permanent GitHub file: data/ht3-control-studio.html.
    Integration-ready HTML/CSS/JS presentation layer only:
    - background is alpha-transparent, not a simulated game scene;
    - no external assets or libraries, and no replacement graphics;
    - Android host should load as an asset in a transparent WebView, above Unity;
    - native hit testing / touch routing is needed for gameplay pass-through;
    - Unity IL2CPP and Android Java layers need their own bridge for any game action;
    - window.HT3Overlay exposes menu open/close for a native host.
    These native components are not supplied or simulated here.
    The demo data below is local preview state only.
  */
  (function () {
    var device=document.getElementById("device");
    var floatButton=document.getElementById("float");
    var panel=document.getElementById("menu");
    var content=document.getElementById("menu-content");
    var title=document.getElementById("menu-title");
    var back=document.getElementById("back");
    var mark=document.getElementById("menu-mark");
    var toastElement=document.getElementById("toast");
    var defaultData={
      health:82,healthLimit:100,spirit:76,injury:4,
      reputation:65,strength:71,skill:60,agility:74,stamina:77,attitude:59,
      bank:1250,sentenceDays:30,day:7,hours:14,minutes:35,allowance:250
    };
    var data=Object.assign({},defaultData);
    var SKEY="ht3-floating-control-studio-v1";
    var current="main",editing=null,draftValue=null,opened=false,toastTimer;
    var lastScroll=0,viewKey=SKEY+"-view";
    var controls={
      health:{name:"Live health",max:1000000,min:0,step:"any",hint:"Active actor health (Float). Demo editing only.",unit:"HP"},
      spirit:{name:"Spirit",max:100,min:0,step:"any",hint:"Active actor spirit, displayed 0–100.",unit:""},
      injury:{name:"Injury",max:1000,min:0,step:"1",hint:"Active actor injury, integer 0–1,000.",unit:""},
      reputation:{name:"Reputation",max:99,min:1,step:"any",hint:"Character.stat index 1 · Float.",unit:""},
      strength:{name:"Strength",max:99,min:1,step:"any",hint:"Character.stat index 2 · Float.",unit:""},
      skill:{name:"Skill",max:99,min:1,step:"any",hint:"Character.stat index 3 · Float.",unit:""},
      agility:{name:"Agility",max:99,min:1,step:"any",hint:"Character.stat index 4 · Float.",unit:""},
      stamina:{name:"Stamina",max:99,min:1,step:"any",hint:"Character.stat index 5 · Float.",unit:""},
      attitude:{name:"Attitude",max:99,min:1,step:"any",hint:"Character.stat index 6 · Float.",unit:""},
      bank:{name:"Bank money",max:2000000000,min:0,step:"1",hint:"Progress.bank · integer 0–2,000,000,000.",unit:"$"},
      sentenceDays:{name:"Sentence days",max:36525,min:0,step:"1",hint:"Progress.sentence · integer 0–36,525.",unit:""},
      day:{name:"Day",max:100000,min:0,step:"1",hint:"Progress.day · integer 0–100,000.",unit:""},
      hours:{name:"Hours",max:23,min:0,step:"1",hint:"24-hour clock · integer 0–23.",unit:""},
      minutes:{name:"Minutes",max:59,min:0,step:"1",hint:"Clock minutes · integer 0–59.",unit:""},
      allowance:{name:"Allowance",max:2000000000,min:0,step:"1",hint:"Progress.allowance · integer 0–2,000,000,000.",unit:"$"}
    };
    var groups={
      health:{name:"Edit health",icon:"heart",subtitle:"Active actor health · display preview",fields:["health"]},
      state:{name:"Spirit / injury",icon:"pulse",subtitle:"Live actor state · display preview",fields:["spirit","injury"]},
      attributes:{name:"Edit attributes",icon:"spark",subtitle:"Character.stat [1–6] · 1–99",fields:["reputation","strength","skill","agility","stamina","attitude"]},
      money:{name:"Edit money",icon:"wallet",subtitle:"Progress bank balance · display preview",fields:["bank"]},
      progress:{name:"Sentence / day / clock",icon:"clock",subtitle:"Progress, time, allowance · display preview",fields:["sentenceDays","day","hours","minutes","allowance"]}
    };

    function icon(name,small){
      var svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
      svg.setAttribute("class","svg"+(small?" sm":""));
      svg.setAttribute("aria-hidden","true");
      var use=document.createElementNS("http://www.w3.org/2000/svg","use");
      use.setAttribute("href","#i-"+name);svg.appendChild(use);return svg;
    }
    function node(tag,className,txt) {
      var e=document.createElement(tag);
      if(className)e.className=className;
      if(txt!==undefined)e.textContent=txt;
      return e;
    }
    function row(label,sub,ico,right,click) {
      var b=node("button","item");b.type="button";
      var tile=node("span","item-ico");tile.appendChild(icon(ico));b.appendChild(tile);
      var words=node("span","item-label",label);
      if(sub)words.appendChild(node("small","",sub));
      b.appendChild(words);
      var tail=node("span","item-right");
      if(right)tail.appendChild(node("span","item-value",right));
      tail.appendChild(icon("arrow",true));b.appendChild(tail);
      b.addEventListener("click",click);
      return b;
    }
    function intro(s) {content.appendChild(node("div","menu-intro",s));}
    function notice(message) {content.appendChild(node("div","group-cap",message));}
    function value(key) {
      var num=data[key];
      if(key==="bank"||key==="allowance")return "$"+Number(num).toLocaleString("en-US");
      if(key==="hours"||key==="minutes")return String(num).padStart(2,"0");
      return String(num);
    }
    function setHeader(name,isMain) {
      title.textContent=name;
      back.hidden=isMain;
      mark.hidden=!isMain;
    }
    function render() {
      content.replaceChildren();
      if(current==="main")return mainMenu();
      if(current==="setup")return setupMenu();
      if(current==="edit")return editMenu();
      groupMenu(current);
    }
    function mainMenu() {
      setHeader("Developer controls",true);
      intro("Choose a control  •  touch rows to open");
      content.appendChild(row("SETUP / RE-SCAN","Status of the live bindings","scan","",function(){navigate("setup");}));
      content.appendChild(row("EDIT HEALTH","Live player health","heart","",function(){navigate("health");}));
      content.appendChild(row("EDIT SPIRIT / INJURY","Active player condition","pulse","",function(){navigate("state");}));
      content.appendChild(row("EDIT ATTRIBUTES","Reputation, strength, skill + more","spark","",function(){navigate("attributes");}));
      content.appendChild(row("EDIT MONEY","Bank balance","wallet","",function(){navigate("money");}));
      content.appendChild(row("EDIT SENTENCE / DAY / CLOCK / ALLOWANCE","World progression fields","clock","",function(){navigate("progress");}));
      var exit=row("EXIT","Minimize to floating icon","power","",closeMenu);
      exit.classList.add("exit");content.appendChild(exit);
    }
    function groupMenu(key) {
      var group=groups[key];
      if(!group){navigate("main");return;}
      setHeader(group.name,false);
      intro(group.subtitle);
      if(key==="health") {
        var card=node("div","mock-visual");
        card.appendChild(node("div","label","PLAYER HEALTH · UI GAUGE"));
        var meter=node("div","meter"),bar=node("span");
        bar.style.width=Math.max(0,Math.min(100,data.health/Math.max(1,data.healthLimit)*100))+"%";
        meter.appendChild(bar);card.appendChild(meter);
        card.appendChild(node("div","value",value("health")+" / "+value("healthLimit")+" HP"));
        content.appendChild(card);
      }
      group.fields.forEach(function(field) {
        var info=controls[field];
        var description=field==="health"?"Float · health +0xB4":
          field==="bank"?"Progress.bank · DWORD":
          field==="spirit"?"Player state · Float":
          field==="injury"?"Player state · DWORD":
          key==="attributes"?"Character stat · Float":
          "Progress · DWORD";
        content.appendChild(row(info.name,description,group.icon,value(field),function(){
          editing=field;draftValue=null;navigate("edit");
        }));
      });
      if(key==="health"){
        var cap=node("div","section-info");
        cap.textContent="Maximum health: "+value("healthLimit")+". Reference only; the source GG menu edits live health, not the stored health cap.";
        content.appendChild(cap);
      }
      if(key==="progress"){
        var cap2=node("div","section-info","Clock values may be overwritten by the running game's simulation. No game is connected here.");
        content.appendChild(cap2);
      }
      content.appendChild(node("div","separator"));
      var backRow=row("BACK","Return to developer controls","back","",function(){navigate("main");});
      content.appendChild(backRow);
    }
    function setupMenu(){
      setHeader("Setup / re-scan",false);
      notice("GG source validates class pointers and active actor state before offering real memory edits. This HTML deliberately does not perform those checks.");
      var checks=[
        ["Xa signature","Not connected"],["Field offsets (6)","Not connected"],
        ["Active character","Not connected"],["Player actor","Not connected"],
        ["Money binding","Not connected"]
      ];
      checks.forEach(function(x){
        var r=node("div","status-item");
        r.appendChild(node("span","",x[0]));r.appendChild(node("b","",x[1]));
        content.appendChild(r);
      });
      var action=node("button","mini-button wide");
      action.type="button";action.appendChild(icon("scan",true));
      action.appendChild(node("span","","Preview re-scan"));
      action.addEventListener("click",function(){toast("UI only — a live re-scan requires an APK/native bridge.");});
      var actionWrap=node("div","edit-wrap");actionWrap.appendChild(action);content.appendChild(actionWrap);
      content.appendChild(node("div","section-info","Original Lua file: data/node_6f2e9a.lua · version 2.1.1. This is a redesigned floating-menu concept, not a second APK."));
    }
    function editMenu() {
      var info=controls[editing];
      if(!info){navigate("main");return;}
      setHeader(info.name,false);
      var wrap=node("form","edit-wrap");
      wrap.noValidate=true;
      wrap.appendChild(node("div","edit-name","CURRENT SAMPLE VALUE"));
      wrap.appendChild(node("div","edit-large",value(editing)));
      var label=node("label","edit-label","New "+info.name.toLowerCase()+" value");
      label.htmlFor="value-input";wrap.appendChild(label);
      var input=node("input","edit-input");
      input.id="value-input";input.type="number";input.inputMode="decimal";
      input.min=String(info.min);input.max=String(info.max);input.step=info.step;
      input.value=draftValue===null?String(data[editing]):String(draftValue);
      input.autocomplete="off";input.setAttribute("aria-label",label.textContent);
      input.addEventListener("input",function(){
        draftValue=input.value;persistView();
      });
      wrap.appendChild(input);
      wrap.appendChild(node("p","edit-help",info.hint));
      var error=node("p","error");error.setAttribute("role","alert");wrap.appendChild(error);
      var actions=node("div","edit-buttons");
      var cancel=node("button","mini-button","Cancel");cancel.type="button";
      cancel.addEventListener("click",function(){draftValue=null;navigate(groupOf(editing));});
      var apply=node("button","mini-button primary");apply.type="submit";
      apply.appendChild(icon("check",true));apply.appendChild(node("span","","Apply preview"));
      actions.appendChild(cancel);actions.appendChild(apply);wrap.appendChild(actions);
      wrap.addEventListener("submit",function(evt){
        evt.preventDefault();
        var raw=input.value.trim();var n=Number(raw);
        if(!raw||!Number.isFinite(n)||n<info.min||n>info.max||(info.step==="1"&&!Number.isInteger(n))){
          error.textContent="Enter a valid "+(info.step==="1"?"whole number ":"number ")+"from "+info.min.toLocaleString("en-US")+" to "+info.max.toLocaleString("en-US")+".";
          return;
        }
        if(editing==="health"&&n>data.healthLimit){
          error.textContent="Health cannot exceed the sample health limit ("+data.healthLimit+").";return;
        }
        data[editing]=n;draftValue=null;persist();persistView();
        // Keep the editor open after Apply, so a close/reopen returns to this exact screen.
        render();positionPanel();
        toast(info.name+" preview updated locally. No game values changed.");
      });
      content.appendChild(wrap);
    }
    function groupOf(k) {
      var names=Object.keys(groups);
      for(var i=0;i<names.length;i++)if(groups[names[i]].fields.indexOf(k)>=0)return names[i];
      return "main";
    }
    function navigate(v){
      if(v!=="edit")draftValue=null;
      current=v;lastScroll=0;persistView();
      render();content.scrollTop=0;positionPanel();
    }
    function backOne(){
      if(current==="main"){closeMenu();return;}
      if(current==="edit"){navigate(groupOf(editing));return;}
      navigate("main");
    }
    function persistView(){
      try {
        localStorage.setItem(viewKey,JSON.stringify({
          current:current,editing:editing,draftValue:draftValue,scrollTop:lastScroll
        }));
      } catch(e) {} // Some WebView storage configurations intentionally disable persistence.
    }
    function restoreView(){
      try {
        var stored=JSON.parse(localStorage.getItem(viewKey)||"{}");
        if(stored && typeof stored==="object"){
          if(stored.current==="main"||stored.current==="setup"||
             (stored.current in groups)||stored.current==="edit"){
            current=stored.current;
          }
          if(typeof stored.editing==="string"&&Object.prototype.hasOwnProperty.call(controls,stored.editing)){
            editing=stored.editing;
          }
          if(stored.draftValue===null||typeof stored.draftValue==="string")draftValue=stored.draftValue;
          if(Number.isFinite(stored.scrollTop)&&stored.scrollTop>=0)lastScroll=stored.scrollTop;
        }
      } catch(e) {}
      if(current==="edit"&&!editing)current="main";
    }
    function persist() {
      try{localStorage.setItem(SKEY,JSON.stringify(data));}catch(e){}
    }
    function restore() {
      try{
        var stored=JSON.parse(localStorage.getItem(SKEY)||"{}");
        Object.keys(defaultData).forEach(function(k){
          if(!Object.prototype.hasOwnProperty.call(stored,k))return;
          var n=Number(stored[k]);
          if(!Number.isFinite(n))return;
          if(k==="healthLimit"){data[k]=100;return;}
          if(controls[k]&&n>=controls[k].min&&n<=controls[k].max&&(controls[k].step!=="1"||Number.isInteger(n)))data[k]=n;
        });
        data.health=Math.min(data.health,data.healthLimit);
      }catch(e){}
    }
    function toast(text) {
      toastElement.textContent=text;toastElement.classList.add("show");
      clearTimeout(toastTimer);toastTimer=setTimeout(function(){toastElement.classList.remove("show");},2600);
    }
    function iconBounds(){return {x:floatButton.offsetLeft,y:floatButton.offsetTop,w:floatButton.offsetWidth,h:floatButton.offsetHeight};}
    function moveIcon(x,y) {
      var pad=9,w=device.clientWidth,h=device.clientHeight;
      x=Math.max(pad,Math.min(w-floatButton.offsetWidth-pad,x));
      y=Math.max(pad,Math.min(h-floatButton.offsetHeight-pad,y));
      floatButton.style.left=x+"px";floatButton.style.top=y+"px";
      if(opened)positionPanel();
    }
    function positionPanel() {
      if(!opened)return;
      var w=device.clientWidth,h=device.clientHeight,icon=iconBounds();
      panel.style.maxHeight=Math.max(20,h-16)+"px";
      panel.style.width=Math.min(340,Math.max(80,w-16))+"px";
      // Read the actual height after rendering. Clamp in either orientation.
      var rect=panel.getBoundingClientRect(),pw=rect.width,ph=rect.height;
      var preferredRight=icon.x+icon.w+10;
      var x=preferredRight+pw+8<=w?preferredRight:icon.x-pw-10;
      x=Math.max(8,Math.min(w-pw-8,x));
      var y=Math.max(8,Math.min(h-ph-8,icon.y+icon.h/2-Math.min(52,ph*.2)));
      panel.style.left=x+"px";panel.style.top=y+"px";
    }
    function openMenu() {
      if(opened)return;
      opened=true;panel.classList.add("open");panel.setAttribute("aria-hidden","false");
      floatButton.setAttribute("aria-expanded","true");
      // Preserve current submenu, the active editor, and any unsubmitted input.
      render();content.scrollTop=lastScroll;positionPanel();
    }
    function closeMenu(){
      if(!opened)return;
      lastScroll=content.scrollTop;
      var activeInput=document.getElementById("value-input");
      if(current==="edit"&&activeInput)draftValue=activeInput.value;
      persistView();
      opened=false;panel.classList.remove("open");panel.setAttribute("aria-hidden","true");
      floatButton.setAttribute("aria-expanded","false");
      floatButton.focus({preventScroll:true});
    }
    function toggleMenu(){if(opened)closeMenu();else openMenu();}
    var gesture=null,suppressClick=false;
    floatButton.addEventListener("pointerdown",function(evt){
      if(evt.button!==0)return;
      var rect=device.getBoundingClientRect();
      gesture={id:evt.pointerId,startX:evt.clientX,startY:evt.clientY,
        offsetX:evt.clientX-rect.left-floatButton.offsetLeft,
        offsetY:evt.clientY-rect.top-floatButton.offsetTop,moved:false};
      floatButton.setPointerCapture(evt.pointerId);
    });
    floatButton.addEventListener("pointermove",function(evt){
      if(!gesture||evt.pointerId!==gesture.id)return;
      if(Math.hypot(evt.clientX-gesture.startX,evt.clientY-gesture.startY)>5)gesture.moved=true;
      if(gesture.moved){
        var rect=device.getBoundingClientRect();
        moveIcon(evt.clientX-rect.left-gesture.offsetX,evt.clientY-rect.top-gesture.offsetY);
      }
    });
    floatButton.addEventListener("pointerup",function(evt){
      if(!gesture||evt.pointerId!==gesture.id)return;
      suppressClick=gesture.moved;
      gesture=null;
    });
    floatButton.addEventListener("pointercancel",function(){gesture=null;suppressClick=true;});
    floatButton.addEventListener("click",function(evt){
      if(suppressClick){evt.preventDefault();suppressClick=false;return;}
      toggleMenu();
    });
    document.getElementById("close").addEventListener("click",closeMenu);
    back.addEventListener("click",backOne);
    document.addEventListener("keydown",function(evt){
      if(evt.key==="Escape"&&opened){evt.preventDefault();backOne();}
    });
    document.addEventListener("pointerdown",function(evt){
      if(!opened||panel.contains(evt.target)||floatButton.contains(evt.target))return;
      closeMenu();
    });
    window.addEventListener("resize",function(){
      var b=iconBounds();moveIcon(b.x,b.y);positionPanel();
    });
    // The native Android host may call these using WebView.evaluateJavascript().
    // They operate on the visual menu only; they do not connect to libil2cpp.
    window.HT3Overlay=Object.freeze({
      open:openMenu,close:closeMenu,toggle:toggleMenu,
      dismiss:closeMenu,
      getView:function(){return {page:current,field:editing,draft:draftValue,open:opened};},
      getDemoValues:function(){return Object.assign({},data);}
    });
    content.addEventListener("scroll",function(){
      if(opened){lastScroll=content.scrollTop;persistView();}
    },{passive:true});
    restore();restoreView();render();
    window.addEventListener("pagehide",persistView);
  })();
  </script>
</body>
</html>
